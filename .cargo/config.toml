[target.'cfg(target_arch = "aarch64")']
rustflags = [
    "-C",
    "target-feature=+aes,+neon"
]

[target.'cfg(target_arch = "x86_64")']
rustflags = [
    "-C",
    "target-feature=+aes,+sse2"
]

[unstable]
codegen-backend = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
overflow-checks = true
panic = 'abort'
rpath = false
strip = "none"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
