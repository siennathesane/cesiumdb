[package]
name = "cesiumdb"
description = "Blazing fast, persistent key-value store for Rust"
license = "GPL-3.0"
repository = "https://github.com/siennathesane/cesiumdb"
authors = ["Sienna Meridian Satterwhite <sienna@r3t.io>"]
version = "0.2.1"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default_features = []
# you have to enable benchmarks to run them. this is due to criterion only being able to access the public API, but i
# don't want to expose most of the API to the public.
benchmarks = []
# Enable OpenTelemetry instrumentation for production observability
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk"]

[dependencies]
bytes = "1.9"# no_std support
crc32fast = "1.4" # no_std support
crossbeam-channel = "0.5" # no_std might be supported soon?
crossbeam-queue = "0.3"# no_std support, i think
crossbeam-skiplist = "0.1" # no_std support, i think
gxhash = "3.4.1"# no_std support
lazy_static = "1.5.0"
loom = { version = "0.7" }
memmap2 = "0.9.5" # there would need to be a functional replacement of the filesystem library, but it might be possible
mimalloc = { version = "0.1.43" } # maybe there's no_std support? big question mark
once_cell = "1.20.2"
parking_lot = { version = "0.12.3", features = ["deadlock_detection"] } # we would need to find a replacement for this, maybe lock_api?
rand = "0.9.0" # has no_std support
rayon = "1.10" # parallel iterators for concurrent shard writes
thiserror = "2.0" # it looks like there is no_std support
tracing = "0.1"
# OpenTelemetry for optional production telemetry (enable with "telemetry" feature)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }

[dev-dependencies]
criterion = "0.5"
hex = "0.4"
proptest = "1"
rand = { version = "0.9", features = ["small_rng"] }
tempfile = "3.14.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[profile.bench]
debug = true

[[bench]]
name = "hlc"
harness = false

[[bench]]
name = "db"
harness = false

[[bench]]
name = "merge"
harness = false

[[bench]]
name = "segment"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "compaction"
harness = false
required-features = ["benchmarks"]

[package.metadata.docs.rs]
rustc-args = ["-C", "target-feature=+aes,+sse2"]

[build-dependencies]
cbindgen = "0.27.0"
