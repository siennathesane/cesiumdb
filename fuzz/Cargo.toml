[package]
name = "cesiumdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
bytes = "1.9"
tempfile = "3.14.0"

[dependencies.cesiumdb]
path = ".."

[[bin]]
name = "fuzz_db_crud"
path = "fuzz_targets/fuzz_db_crud.rs"
test = false
doc = false
bench = false


